name: SEO contract

on:
  pull_request:
    paths:
      - "frontend-vercel/**"
      - ".github/workflows/seo-contract.yml"
  push:
    branches:
      - main
    paths:
      - "frontend-vercel/**"
      - ".github/workflows/seo-contract.yml"

concurrency:
  group: seo-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-vercel
    env:
      SEO_PRERENDER_REMOTE_REQUIRED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO contract
        run: npm run test:seo
